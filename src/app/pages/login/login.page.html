<ion-header>
  <ion-toolbar>
    <ion-title>Adopta!</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-container">
    <h1>Iniciar sesión</h1>
    <p>Entra para conocer a los perros que buscan hogar.</p>

    <form #formulario="ngForm" (ngSubmit)="entrar()">
      <ion-list>
        <ion-item>
          <ion-input
            label="Correo"
            labelPlacement="stacked"
            name="correo"
            type="email"
            [(ngModel)]="correo"
            required
            autocomplete="email"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Clave"
            labelPlacement="stacked"
            name="clave"
            type="password"
            [(ngModel)]="clave"
            required
            autocomplete="current-password"
          ></ion-input>
        </ion-item>
      </ion-list>

      @if (error) {
        <ion-text color="danger"><p class="error">{{ error }}</p></ion-text>
      }

      <ion-button expand="block" type="submit" [disabled]="formulario.invalid">
        Entrar
      </ion-button>
    </form>

    <ion-button expand="block" fill="clear" (click)="irARegistro()">
      Crear una cuenta
    </ion-button>
  </div>
</ion-content>
