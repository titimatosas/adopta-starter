<ion-card [routerLink]="['/detalle', perro.id]" button="true">
  <ion-img [src]="perro.foto" [alt]="'Foto de ' + perro.nombre"></ion-img>

  <ion-card-header>
    <ion-card-title>{{ perro.nombre }}</ion-card-title>
    <ion-badge [color]="perro.adoptado ? 'medium' : 'success'">
      {{ perro.adoptado ? 'Adoptado' : 'Disponible' }}
    </ion-badge>
  </ion-card-header>

  <ion-card-content>
    <ion-text>
      <p>{{ perro.raza }} · {{ perro.edad }}</p>
      <p>{{ perro.descripcion }}</p>
    </ion-text>
  </ion-card-content>
</ion-card>
